<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App Project</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/index.css" />
  </head>
  <body>
    <div class="Weather-app">
      <header>
        <form>
          <input type="search" placeholder="Enter a city" required />
          <input type="submit" value="search" />
        </form>
      </header>
      <main>
        <h1>Paris</h1>
        <div>
          <p>
            Tuesday 14:49, Scattered clouds
            <br />
            Humidity: 66%, Wind 3.13km/h
          </p>
        </div>
        <div>⛅ 12&degC</div>
      </main>
      <footer>
        This project was coded by
        <a href="https://github.com/ValerieGrowth" target="_blank"></a>
        and is open-sourced on GitHub
        <a
          href="https://github.com/ValerieGrowth/Weather-App"
          target="_blank"
        ></a>
        and hosted on Netlify
        <a href="https://spikes-weather-app.netlify.app/" target="-blank"></a>
      </footer>
    </div>
  </body>
</html>
