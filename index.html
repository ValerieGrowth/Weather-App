<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App Project</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/index.css" />
  </head>
  <body>
    <div class="weather-app">
      <header>
        <form class="search-form">
          <input type="search" placeholder="Enter a city" required class="search-form-input" />
          <input type="submit" value="search" class="search-form-button"/>
        </form>
      </header>
      <main>
        <div class="weather-app-data">
        <h1 class="weather-app-city">Paris</h1>
        <div>
          <p weather-app-details>
            Tuesday 14:49, Scattered clouds
            <br />
            Humidity:<strong> 66% </strong>, Wind <strong>3.13km/</strong>
          </p>
        </div>
         <div class="weather-app-temperature-container">
            <div class="weather-app-icon">🌤️</div>
            <div class="weather-app-temperature">12</div>
            <div class="weather-app-unit">°C</div>
          </div> 
        </main>
      <footer>
        This project was coded by
        <a href="https://github.com/ValerieGrowth" target="_blank"
          >Valerie Waceera</a
        >
        is
        <a href="https://github.com/ValerieGrowth/Weather-App" target="_blank"
          >open-sourced on GitHub</a
        >and
        <a href="https://spikes-weather-app.netlify.app/" target="_blank">
          hosted on Netlify</a>
      </footer>
    </div>
  </body>
</html>
